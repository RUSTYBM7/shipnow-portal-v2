  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('SW registered:', registration.scope);

            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New content available
                  console.log('New content available, refresh to update');

                  // Notify user
                  const event = new CustomEvent('sw-update-available');
                  window.dispatchEvent(event);
                }
              });
            });
          })
          .catch(error => {
            console.log('SW registration failed:', error);
          });

        // Listen for messages from service worker
        navigator.serviceWorker.addEventListener('message', (event) => {
          console.log('SW message:', event.data);

          if (event.data.type === 'SW_ACTIVATED') {
            console.log('Service worker activated v' + event.data.version);
          }

          if (event.data.type === 'APP_INSTALLED') {
            console.log('App installed on', event.data.platform);
            // Track installation
            if (window.trackPWAInstall) {
              window.trackPWAInstall(event.data.platform);
            }
          }
        });
      });

      // Handle install prompt
      let deferredPrompt = null;

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;

        // Show custom install button/banner
        const event = new CustomEvent('pwa-install-prompt', { detail: e });
        window.dispatchEvent(event);
      });

      window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        console.log('PWA installed');

        // Track installation
        if (window.trackPWAInstall) {
          window.trackPWAInstall('web');
        }
      });

      // Expose install function globally
      window.installPWA = async () => {
        if (!deferredPrompt) {
          console.log('Install prompt not available');
          return false;
        }

        const result = await deferredPrompt.prompt();
        console.log('Install prompt result:', result.outcome);
        deferredPrompt = null;
        return result.outcome === 'accepted';
      };

      // Track PWA installation
      window.trackPWAInstall = async (platform) => {
        console.log('PWA installed on:', platform);
        // Could send to analytics or backend
        try {
          await fetch('https://zygoqqsgzhgpvlpttfbk.supabase.co/functions/v1/pwa-track', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              event: 'pwa_installed',
              platform,
              timestamp: new Date().toISOString(),
              user_agent: navigator.userAgent
            })
          });
        } catch (e) {
          console.log('Failed to track PWA install:', e);
        }
      };
    }
  </script>
